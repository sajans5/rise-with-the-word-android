u
name: Build Rise With The Word APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Rise_With_The_Word_Android_Studio_Project.zip"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Unpack Android project ZIP
        run: |
          set -euo pipefail
          unzip -q Rise_With_The_Word_Android_Studio_Project.zip -d project

          PROJECT_DIR="$(dirname "$(find project -type f -name settings.gradle.kts -print -quit)")"

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "Android project files not found in ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"
          
          - name: ChatGPT Integration
  uses: kxxt/chatgpt-action@v0.3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Bundle full offline Catholic Bible
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/odr-source"

          git clone --depth 1 \
            https://github.com/janvier-s/original-douay-rheims.git \
            "$RUNNER_TEMP/odr-source/repo"

          DATA_ROOT="$RUNNER_TEMP/odr-source/repo"

          if [ ! -f "$DATA_ROOT/manifest.json" ] || \
             [ ! -d "$DATA_ROOT/bible/raw" ]; then
            echo "Bible dataset is missing required files."
            exit 1
          fi

          python "$PROJECT_DIR/tools/build_bible.py" \
            "$DATA_ROOT" \
            "$PROJECT_DIR/app/src/main/assets/bible-full-data.js"

          test -s "$PROJECT_DIR/app/src/main/assets/bible-full-data.js"
- name: Download a Build Artifact
  uses: actions/download-artifact@v8.0.2
  with:
    # Name of the artifact to download. If unspecified, all artifacts for the run are downloaded.
    name: # optional
    # IDs of the artifacts to download, comma-separated. Either inputs `artifact-ids` or `name` can be used, but not both.
    artifact-ids: # optional
    # Destination path. Supports basic tilde expansion. Defaults to $GITHUB_WORKSPACE
    path: # optional
    # A glob pattern matching the artifacts that should be downloaded. Ignored if name is specified.
    pattern: # optional
    # When multiple artifacts are matched, this changes the behavior of the destination directories. If true, the downloaded artifacts will be in the same directory specified by path. If false, the downloaded artifacts will be extracted into individual named directories within the specified path.
    merge-multiple: # optional, default is false
    # The GitHub token used to authenticate with the GitHub API. This is required when downloading artifacts from a different repository or from a different workflow run. If this is not specified, the action will attempt to download artifacts from the current repository and the current workflow run.
    github-token: # optional
    # The repository owner and the repository name joined together by "/". If github-token is specified, this is the repository that artifacts will be downloaded from.
    repository: # optional, default is ${{ github.repository }}
    # The id of the workflow run where the desired download artifact was uploaded from. If github-token is specified, this is the run that artifacts will be downloaded from.
    run-id: # optional, default is ${{ github.run_id }}
    # If true, the downloaded artifact will not be automatically extracted/decompressed. This is useful when you want to handle the artifact as-is without extraction.
    skip-decompress: # optional, default is false
    # The behavior when a downloaded artifact's digest does not match the expected digest. Options: ignore, info, warn, error. Default is error which will fail the action.
    digest-mismatch: # optional, default is error
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
- name: ChatGPT Buttler
  uses: SureStacks/chatgpt-butler@v1.0.1
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
- name: Setup Node.js environment
  uses: actions/setup-node@v7.1.0
  with:
    # Version Spec of the version to use. Examples: 12.x, 10.15.1, >=10.15.0.
    node-version: # optional
    # File containing the version Spec of the version to use.  Examples: package.json, .nvmrc, .node-version, .tool-versions, mise.toml.
    node-version-file: # optional
    # Target architecture for Node to use. Examples: x86, x64. Will use system architecture by default.
    architecture: # optional
    # Set this option if you want the action to check for the latest available version that satisfies the version spec.
    check-latest: # optional
    # Optional registry to set up for auth. Will set the registry in a project level .npmrc and .yarnrc file, and set up auth to read in from env.NODE_AUTH_TOKEN.
    registry-url: # optional
    # Optional scope for authenticating against scoped registries. Will fall back to the repository owner when using the GitHub Packages registry (https://npm.pkg.github.com/).
    scope: # optional
    # Used to pull node distributions from node-versions. Since there's a default, this is typically not supplied by the user. When running this action on github.com, the default value is sufficient. When running on GHES, you can pass a personal access token for github.com if you are experiencing rate limiting.
    token: # optional, default is ${{ github.server_url == 'https://github.com' && github.token || '' }}
    # Used to specify a package manager for caching in the default directory. Supported values: npm, yarn, pnpm.
    cache: # optional
    # Set to false to disable automatic caching. By default, caching is enabled when either devEngines.packageManager or the top-level packageManager field in package.json specifies npm as the package manager.
    package-manager-cache: # optional, default is true
    # Used to specify the path to a dependency file: package-lock.json, yarn.lock, etc. Supports wildcards or a list of file names for caching multiple dependencies.
    cache-dependency-path: # optional
    # Used to specify an alternative mirror to download Node.js binaries from
    mirror: # optional
    # The token used as Authorization header when fetching from the mirror
    mirror-token: # optional
      - name: Fix Java and Kotlin compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          p = Path(os.environ["PROJECT_DIR"]) / "app/build.gradle.kts"
          s = p.read_text()

          if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              marker = "    defaultConfig {"
              if marker not in s:
                  raise SystemExit("Could not find defaultConfig")
              insert = """    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

          """
              s = s.replace(marker, insert + marker, 1)

          if 'jvmTarget = "17"' not in s:
              marker = "    defaultConfig {"
              if marker not in s:
                  raise SystemExit("Could not find defaultConfig for Kotlin")
              insert = """    kotlinOptions {
                  jvmTarget = "17"
              }

          """
              s = s.replace(marker, insert + marker, 1)

          p.write_text(s)
          print("Java and Kotlin targets configured for JVM 17.")
          PY

      - name: Build debug APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rise-With-The-Word-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
