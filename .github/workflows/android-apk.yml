name: Build Rise With The Word APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Rise_With_The_Word_Android_Studio_Project.zip"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Unpack Android project ZIP
        run: |
          unzip -q Rise_With_The_Word_Android_Studio_Project.zip -d project
          PROJECT_DIR="$(dirname "$(find project -type f -name settings.gradle.kts -print -quit)")"
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "Android project files were not found in the ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Android project at: $PROJECT_DIR"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Bundle full offline Catholic Bible
        env:
          BIBLE_SOURCE_COMMIT: cd4439a1b5bbf2abe253d68b0896c3c60e8f27bc
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/odr-source"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://codeload.github.com/janvier-s/original-douay-rheims/zip/${BIBLE_SOURCE_COMMIT}" \
            --output "$RUNNER_TEMP/odr-source.zip"
          unzip -q "$RUNNER_TEMP/odr-source.zip" -d "$RUNNER_TEMP/odr-source"
          DATA_ROOT="$(dirname "$(find "$RUNNER_TEMP/odr-source" -type f -name manifest.json -print -quit)")"
          if [ -z "$DATA_ROOT" ] || [ ! -d "$DATA_ROOT/bible/raw" ]; then
            echo "Could not locate the public-domain Bible dataset."
            exit 1
          fi
          python "$PROJECT_DIR/tools/build_bible.py" "$DATA_ROOT" "$PROJECT_DIR/app/src/main/assets/bible-full-data.js"
          test -s "$PROJECT_DIR/app/src/main/assets/bible-full-data.js"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Fix Java and Kotlin compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          p = Path(os.environ["PROJECT_DIR"]) / "app/build.gradle.kts"
          s = p.read_text(encoding="utf-8")

          if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              marker = "    defaultConfig {"
              if marker not in s:
                  raise SystemExit("Could not find defaultConfig in app/build.gradle.kts")
              insert = """    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

          """
              s = s.replace(marker, insert + marker, 1)

          if 'jvmTarget = "17"' not in s:
              marker = "    defaultConfig {"
              if marker not in s:
                  raise SystemExit("Could not find defaultConfig for Kotlin compatibility")
              insert = """    kotlinOptions {
                  jvmTarget = "17"
              }

          """
              s = s.replace(marker, insert + marker, 1)

          p.write_text(s, encoding="utf-8")
          print("Java and Kotlin targets configured for JVM 17.")
          PY

      - name: Build debug APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rise-With-The-Word-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
