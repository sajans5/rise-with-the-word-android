name: Build Rise With The Word APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Rise_With_The_Word_Android_Studio_Project.zip"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Unpack Android project ZIP
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_ZIP="Rise_With_The_Word_Android_Studio_Project.zip"
          if [ ! -f "$PROJECT_ZIP" ]; then
            echo "Missing $PROJECT_ZIP at the repository root."
            exit 1
          fi
          unzip -q "$PROJECT_ZIP" -d project
          SETTINGS_FILE="$(find project -type f -name settings.gradle.kts -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Could not find settings.gradle.kts inside the ZIP."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "Android app/build.gradle.kts not found under $PROJECT_DIR."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Android project at: $PROJECT_DIR"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch pinned public-domain Bible source
        env:
          BIBLE_SOURCE_COMMIT: cd4439a1b5bbf2abe253d68b0896c3c60e8f27bc
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DIR="$RUNNER_TEMP/original-douay-rheims"
          git clone --filter=blob:none https://github.com/janvier-s/original-douay-rheims.git "$SOURCE_DIR"
          git -C "$SOURCE_DIR" checkout --detach "$BIBLE_SOURCE_COMMIT"
          if [ ! -f "$SOURCE_DIR/manifest.json" ] || [ ! -d "$SOURCE_DIR/bible/raw" ]; then
            echo "Pinned Bible checkout is missing manifest.json or bible/raw."
            exit 1
          fi
          echo "BIBLE_DATA_ROOT=$SOURCE_DIR" >> "$GITHUB_ENV"

      - name: Bundle full offline Bible data
        shell: bash
        run: |
          set -euo pipefail
          BUILDER="$PROJECT_DIR/tools/build_bible.py"
          OUTPUT="$PROJECT_DIR/app/src/main/assets/bible-full-data.js"
          if [ ! -f "$BUILDER" ]; then
            echo "Bible builder not found: $BUILDER"
            exit 1
          fi
          mkdir -p "$(dirname "$OUTPUT")"
          python "$BUILDER" "$BIBLE_DATA_ROOT" "$OUTPUT"
          test -s "$OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Align Java and Kotlin targets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path(os.environ["PROJECT_DIR"]) / "app/build.gradle.kts"
          source = path.read_text(encoding="utf-8")
          if "sourceCompatibility = JavaVersion.VERSION_17" not in source:
              marker = "    defaultConfig {"
              if marker not in source:
                  raise SystemExit("Could not find defaultConfig in app/build.gradle.kts")
              block = (
                  "    compileOptions {\n"
                  "        sourceCompatibility = JavaVersion.VERSION_17\n"
                  "        targetCompatibility = JavaVersion.VERSION_17\n"
                  "    }\n\n"
              )
              source = source.replace(marker, block + marker, 1)

          if 'jvmTarget = "17"' not in source:
              marker = "    defaultConfig {"
              if marker not in source:
                  raise SystemExit("Could not find defaultConfig for Kotlin target")
              block = (
                  "    kotlinOptions {\n"
                  '        jvmTarget = "17"\n'
                  "    }\n\n"
              )
              source = source.replace(marker, block + marker, 1)

          path.write_text(source, encoding="utf-8")
          print("Java and Kotlin targets set to JVM 17.")
          PY

      - name: Build debug APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rise-With-The-Word-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
