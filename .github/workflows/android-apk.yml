name: Build Rise With The Word APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Rise_With_The_Word_Android_Studio_Project.zip"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          set -euo pipefail
          PROJECT_ZIP="Rise_With_The_Word_Android_Studio_Project.zip"
          test -f "$PROJECT_ZIP" || { echo "Missing $PROJECT_ZIP"; exit 1; }
          unzip -q "$PROJECT_ZIP" -d project
          SETTINGS_FILE="$(find project -type f -name settings.gradle.kts -print -quit)"
          test -n "$SETTINGS_FILE" || { echo "Could not locate settings.gradle.kts"; exit 1; }
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Android project at $PROJECT_DIR"
          test -f "$PROJECT_DIR/tools/build_bible.py"

      - name: Validate JavaScript syntax
        run: |
          set -euo pipefail
          shopt -s nullglob
          JS_FILES=("$PROJECT_DIR"/app/src/main/assets/js/*.js)
          if [[ ${#JS_FILES[@]} -eq 0 ]]; then
            echo "No JavaScript files found."
            exit 1
          fi
          for file in "${JS_FILES[@]}"; do node --check "$file"; done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch pinned Douay-Rheims source
        run: |
          set -euo pipefail
          SOURCE_DIR="$RUNNER_TEMP/original-douay-rheims"
          git clone https://github.com/janvier-s/original-douay-rheims.git "$SOURCE_DIR"
          # Fail rather than silently building from an unreviewed moving branch.
          git -C "$SOURCE_DIR" checkout d82b2852d55a2ab8f0e57311ee42acde25740781
          test -f "$SOURCE_DIR/manifest.json"
          test -d "$SOURCE_DIR/bible/raw"
          echo "BIBLE_DATA_ROOT=$SOURCE_DIR" >> "$GITHUB_ENV"

      - name: Generate offline Bible data
        run: |
          set -euo pipefail
          OUTPUT="$PROJECT_DIR/app/src/main/assets/bible-full-data.js"
          python "$PROJECT_DIR/tools/build_bible.py" "$BIBLE_DATA_ROOT" "$OUTPUT"
          test -s "$OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: |
          set -euo pipefail
          gradle --version
          gradle -p "$PROJECT_DIR" --no-daemon assembleDebug

      - name: Verify APK exists
        run: |
          set -euo pipefail
          APK_PATH="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_PATH" || { echo "APK was not generated."; exit 1; }
          ls -lh "$APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rise-With-The-Word-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            ${{ env.PROJECT_DIR }}/**/build/reports/**
            ${{ env.PROJECT_DIR }}/**/build/test-results/**
            ${{ env.PROJECT_DIR }}/**/*.log
          if-no-files-found: ignore
