name: Build Rise With The Word APK

# Run it from the Actions tab (Run workflow), or it runs automatically when you upload a new project ZIP.
on:
  workflow_dispatch:
  push:
    paths:
      - "Rise_With_The_Word_Android_Studio_Project.zip"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Unpack Android project ZIP
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_ZIP="Rise_With_The_Word_Android_Studio_Project.zip"
          if [ ! -f "$PROJECT_ZIP" ]; then
            echo "Missing $PROJECT_ZIP at the repository root. Upload the ZIP with exactly this name."
            exit 1
          fi
          unzip -q "$PROJECT_ZIP" -d project
          SETTINGS_FILE="$(find project -type f -name settings.gradle.kts -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Could not find settings.gradle.kts inside the ZIP."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Android project at: $PROJECT_DIR"

      - name: Check the app's JavaScript for typing mistakes
        shell: bash
        run: |
          set -euo pipefail
          for f in "$PROJECT_DIR"/app/src/main/assets/js/*.js; do
            node --check "$f"
          done
          echo "All JavaScript files passed the syntax check."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch public-domain Bible source (Douay-Rheims, CC0)
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DIR="$RUNNER_TEMP/original-douay-rheims"
          git clone https://github.com/janvier-s/original-douay-rheims.git "$SOURCE_DIR"
          # Pin to the exact version this app was tested with (falls back to latest if unavailable).
          git -C "$SOURCE_DIR" checkout cd4439a1b5bbf2abe253d68b0896c3c60e8f27bc || echo "Pinned commit not found; using latest."
          if [ ! -f "$SOURCE_DIR/manifest.json" ] || [ ! -d "$SOURCE_DIR/bible/raw" ]; then
            echo "Bible repository is missing manifest.json or bible/raw."
            exit 1
          fi
          echo "BIBLE_DATA_ROOT=$SOURCE_DIR" >> "$GITHUB_ENV"

      - name: Bundle the complete offline Bible into the app
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$PROJECT_DIR/app/src/main/assets/bible-full-data.js"
          python "$PROJECT_DIR/tools/build_bible.py" "$BIBLE_DATA_ROOT" "$OUTPUT"
          test -s "$OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rise-With-The-Word-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
